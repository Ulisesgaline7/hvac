<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f5f7; color: #1f2937; }
  main { max-width: 340px; padding: 1.25rem; text-align: center; }
  button { margin-top: 1rem; padding: .8rem 1.4rem; border: 0; border-radius: 10px; background: #0284c7; color: #fff; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>No hay señal en este momento. Lo que ya guardó está a salvo. Para continuar, busque señal y reintente.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
